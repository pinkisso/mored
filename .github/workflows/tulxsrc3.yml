
name: Update tulxsrc3

on:
  schedule:
    - cron: "20 */4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update channel tokens
        run: python res/26-3/tulxsrc3.py

      - name: Commit updated M3U8 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add res/26-3/szc3.m3u8 \
                  res/26-3/koza3.m3u8 \
                  res/26-3/trt13.m3u8 \
                  res/26-3/tv1003.m3u8 \
                  res/26-3/nowtv3.m3u8 \
                  res/26-3/atv3.m3u8

          if git diff --cached --quiet; then
            echo "No token changes detected."
          else
            git commit -m "Update tulxsrc3"
            git push
          fi
