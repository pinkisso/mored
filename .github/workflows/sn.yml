name: gene-sn

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate 0A.m3u
        run: |
          python res/isr/sn.py

      - name: Check for changes
        id: changes
        run: |
          if git status --short -- res/isr/sn.m3u | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sn.m3u has changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sn.m3u has not changed."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "gitactaut"
          git config user.email "noz@non.ecom"

          git add res/isr/sn.m3u
          git commit -m "Update sn.m3u"
          git push
