
name: Update tulxsrc1

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update channel tokens
        run: python res/26-3/tulxsrc1.py

      - name: Commit updated M3U8 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add res/26-3/szc1.m3u8 \
                  res/26-3/koza1.m3u8 \
                  res/26-3/trt11.m3u8 \
                  res/26-3/tv1001.m3u8 \
                  res/26-3/nowtv1.m3u8 \
                  res/26-3/atv1.m3u8

          if git diff --cached --quiet; then
            echo "No token changes detected."
          else
            git commit -m "Update tulxsrc1"
            git push
          fi
